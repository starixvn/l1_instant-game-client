variables:
    COCOS_VERSION: 2.4.6

include:
    - project: "ci/repos-ci/pentagon_l1_instant_game_client"
      ref: master
      file: "gitlab-ci.yml"
      
    -  project: "ci/repos-ci/pentagon_l2_instant_game_client"
      ref: master
      file: "gitlab-ci.yml"

variables:
    COCOS_VERSION: 2.4.6

.build_cocos_creator_script: &build_cocos_creator_script
    stage: build-cocos-web
    script:
        - echo "====== Build Cocos Web Mobile ======"
        - echo $DEPLOY_ENV
        - echo $STACK_NAME
        - echo $CI_COMMIT_BRANCH
        - echo $CI_COMMIT_REF_NAME
        - npm set registry http://npm.lumigame.com
        - yarn install
        - if [ "$COCOS_VERSION" == "" ]; then
          export COCOS_VERSION="2.4.0";
          else
          export COCOS_VERSION=$COCOS_VERSION;
          fi
        - if [ "$COCOS_VERSION" == "2.2.2" ]; then
          /Applications/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;webOrientation=landscape;md5Cache=true";
          else
          /Applications/CocosCreator/Creator/$COCOS_VERSION/CocosCreator.app/Contents/MacOS/CocosCreator --path ./ --build "platform=web-mobile;inlineSpriteFrames=true;webOrientation=landscape;md5Cache=true";
          fi
    tags:
        - cocos
    artifacts:
        paths:
            - ./build/web-mobile
        expire_in: 1 day

.base_build_cocos_web_l1_instant_game_client:
    <<: *build_cocos_creator_script
    extends:
        - .deploy_vars_l1_instant_game_client
        - .build:image:l1_instant_game_client:rules

.base_build_cocos_web_l2_instant_game_client:
    <<: *build_cocos_creator_script
    extends:
        - .deploy_vars_l2_instant_game_client
        - .build:image:l2_instant_game_client:rules

.base_build_cocos_web_l1_instant_game_client_remove_config:
    <<: *build_cocos_creator_script
    extends:
        - .deploy_vars_l1_instant_game_client_remove_config
        - .build:image:l1_instant_game_client_remove_config:rules