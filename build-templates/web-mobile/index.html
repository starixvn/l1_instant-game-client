<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Saba Club</title>
        <!--http://www.html5rocks.com/en/mobile/mobifying/-->
        <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1" />

        <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="format-detection" content="telephone=no" />

        <meta name="mobile-web-app-capable" content="yes" />

        <!-- force webkit on 360 -->
        <meta name="renderer" content="webkit" />
        <meta name="force-rendering" content="webkit" />
        <!-- force edge on IE -->
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta name="msapplication-tap-highlight" content="no" />

        <!-- force full screen on some browser -->
        <meta name="full-screen" content="yes" />
        <meta name="x5-fullscreen" content="true" />
        <meta name="360-fullscreen" content="true" />

        <!-- force screen orientation on some browser -->
        <meta name="screen-orientation" content="landscape" />
        <meta name="x5-orientation" content="landscape" />

        <!--fix fireball/issues/3568 -->
        <!--<meta name="browsermode" content="application">-->
        <meta name="x5-page-mode" content="app" />

        <!--<link rel="apple-touch-icon" href=".png" />-->
        <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

        <link rel="stylesheet" type="text/css" href="style-mobile.css" />
        <link rel="icon" href="favicon.ico?v=2" />
        <link rel="stylesheet" type="text/css" href="./loading-bar/loading-bar.min.css" />
    </head>

    <body>
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0" width="1" height="1"></canvas>
        <div id="myInstruction" class="instruction">
            <div class="instruction-content">
                <span class="close"></span>
                <img class="img-sroll" src="fullscreen-drag.gif" />
            </div>
        </div>
        <div id="splash" class="flash-container">
            <div id="splash_logo"></div>
            <div id="splash_text" class="splash_text"></div>
            <div class="progress-bar stripes">
                <span style="width: 0%"></span>
            </div>
            <div class="ldBar label-center" data-value="0" data-preset="circle" style="width: 100%"></div>
        </div>
        <div id="buttonFullAndroid" class="instruction">
            <img class="img-sroll" src="fullscreen-click.gif" />
        </div>
        <script type="text/javascript" src="./loading-bar/loading-bar.min.js"></script>
        <script src="src/settings.js" charset="utf-8"></script>
        <script src="main.js" charset="utf-8"></script>
        <script type="text/javascript" src="./configs.js"></script>
        <script type="text/javascript" src="./index.js"></script>
        <script async data-id="pulse" data-trackid="mqcajnfm" src="https://beacon.fusioncdn.com/pulse.js?trackid=mqcajnfm"></script>
    </body>
</html>
